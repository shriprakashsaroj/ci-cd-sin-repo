version: 0.2
phases:
  pre_build:
    commands:
      - echo "Checking index.html..."

  build:
    commands:
      - |
        if [ ! -f index.html ]; then
          echo "ERROR: index.html not found!"
          exit 1
        fi
      - |
        if ! grep -q "Attari Classes" index.html; then
          echo "ERROR: 'Attari Classes' text not found in index.html!"
          exit 1
        fi
      - echo "Validation successful."

artifacts:
  files:
    - index.html
